<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{DIAGRAM_TITLE}}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell", sans-serif;
            {{BACKGROUND_STYLES}}
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        /* Animated background particles */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            {{BACKGROUND_ANIMATION}}
            animation: pulse 15s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.8; }
        }

        .container {
            width: 100%;
            max-width: 1400px;
            position: relative;
            z-index: 1;
        }

        /* Header with glassmorphism */
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            {{HEADER_STYLES}}
            animation: fadeInDown 1s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            {{TITLE_STYLES}}
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .subtitle {
            {{SUBTITLE_STYLES}}
            font-size: 1.1em;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        /* Diagram container with enhanced glassmorphism */
        .diagram-wrapper {
            {{DIAGRAM_WRAPPER_STYLES}}
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
            animation: fadeIn 1.2s ease-out;
            position: relative;
            overflow: hidden;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .diagram-wrapper::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, {{BORDER_GRADIENT}});
            border-radius: 24px;
            z-index: -1;
            animation: glow 3s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }

        /* Info cards */
        .info-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-card {
            {{INFO_CARD_STYLES}}
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s ease;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .info-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
        }

        .info-card h3 {
            font-size: 1.2em;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .info-card p {
            font-size: 0.95em;
            line-height: 1.6;
        }

        /* Floating action buttons */
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            {{BUTTON_STYLES}}
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            font-size: 1em;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }

        /* Responsive design */
        @media (max-width: 768px) {
            body {
                padding: 20px 10px;
            }

            h1 {
                font-size: 1.8em;
            }

            .diagram-wrapper {
                padding: 15px;
            }

            .info-cards {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }

        /* SVG responsiveness */
        .diagram-wrapper svg {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        /* Loading overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .loading-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: {{PRIMARY_COLOR}};
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <div class="container">
        <header class="header">
            <h1>{{DIAGRAM_TITLE}}</h1>
            <p class="subtitle">{{DIAGRAM_SUBTITLE}}</p>
        </header>

        <div class="diagram-wrapper">
            <!-- SVG EMBEDDED HERE -->
            {{SVG_CONTENT}}
        </div>

        <div class="info-cards">
            <div class="info-card">
                <h3>📊 Diagram Information</h3>
                <p><strong>Type:</strong> {{DIAGRAM_TYPE}}</p>
                <p><strong>Style:</strong> {{DIAGRAM_STYLE}}</p>
                <p><strong>Size:</strong> {{DIAGRAM_SIZE}}</p>
            </div>

            <div class="info-card">
                <h3>🔄 Data Flows</h3>
                <p>{{DATA_FLOWS}}</p>
            </div>

            <div class="info-card">
                <h3>⚡ Core Features</h3>
                <p>{{CORE_FEATURES}}</p>
            </div>
        </div>

        <div class="controls">
            <button class="btn" onclick="refreshDiagram()">
                🔄 Refresh
            </button>
            <button class="btn" onclick="toggleFullscreen()">
                🔲 Fullscreen
            </button>
            <button class="btn" onclick="printDiagram()">
                🖨️ Print
            </button>
        </div>
    </div>

    <script>
        function refreshDiagram() {
            const overlay = document.getElementById('loadingOverlay');
            overlay.classList.add('active');

            setTimeout(() => {
                location.reload();
            }, 1000);
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        function printDiagram() {
            window.print();
        }

        // Smooth scroll behavior
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });

        // Remove loading overlay when page is ready
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loadingOverlay').classList.remove('active');
            }, 500);
        });
    </script>
</body>
</html>
